<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Maestra K530 - Vanessa la Milanesa</title>
    <style>
        /* --- ESTILOS PANTALLA (MODO APPLE GLASS) --- */
        body {
            /* Un fondo degradado bonito para que resalte el efecto vidrio */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333; /* Texto oscuro para leer bien */
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El contenedor principal con efecto vidrio */
        .glass-container {
            background: rgba(255, 255, 255, 0.75); /* Blanco semi-transparente */
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); /* Sombra suave */
            backdrop-filter: blur(15px); /* EL TRUCO: desenfoca el fondo */
            -webkit-backdrop-filter: blur(15px); /* Para Safari/iOS */
            border-radius: 25px; /* Bordes redondeados tipo Apple */
            border: 1px solid rgba(255, 255, 255, 0.5); /* Borde blanco sutil */
            padding: 30px;
            max-width: 900px;
            width: 100%;
            overflow-x: auto; /* Para que la tabla no rompa el diseño en pantallas pequeñas */
        }

        h1 {
            text-align: center;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 25px;
        }

        /* Botón de Imprimir estilo "Cerrar" de la imagen */
        .btn-print {
            display: block;
            width: 100%;
            padding: 15px;
            background: #1d1d1f; /* Color oscuro como en tu foto */
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background 0.3s ease;
        }
        .btn-print:hover {
            background: #333;
        }

        /* Estilos de la Tabla */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px; /* Espacio entre filas */
        }
        th {
            text-align: left;
            padding: 15px;
            color: #6e6e73;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        td {
            background: rgba(255, 255, 255, 0.6); /* Fondo blanco sutil para las filas */
            padding: 15px;
            border: none;
            font-size: 1rem;
        }
        /* Bordes redondeados para las filas de la tabla */
        tr td:first-child { border-top-left-radius: 15px; border-bottom-left-radius: 15px; }
        tr td:last-child { border-top-right-radius: 15px; border-bottom-right-radius: 15px; }

        code {
            background: rgba(0,0,0,0.05);
            padding: 5px 8px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        /* Colores sutiles para las categorías */
        .cat-HARDWARE_K530 { color: #e02424; }
        .cat-ANDROID_S20 { color: #00c853; }
        .cat-TERMUX_CMD { color: #0091ea; }

        /* --- ESTILOS PARA IMPRESIÓN (SE MANTIENE IGUAL DE LIMPIO) --- */
        @media print {
            body { background: none; padding: 0; color: black; }
            .glass-container {
                background: none;
                box-shadow: none;
                backdrop-filter: none;
                border: none;
                border-radius: 0;
                padding: 0;
                width: 100%;
            }
            .btn-print { display: none; }
            table { width: 100%; border-collapse: collapse; border-spacing: 0; }
            th, td { border: 1px solid #000 !important; padding: 8px; background: none !important; border-radius: 0 !important;}
            th { background-color: #eee !important; color: black !important; -webkit-print-color-adjust: exact; }
            h1 { color: black; border-bottom: 2px solid black; }
            code { background: none; border: 1px solid #ccc; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>📚 MANUAL DE COMBATE K530 + S20</h1>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Hoja A4</button>

        <table id="tabla-atajos">
            <thead>
                <tr>
                    <th>Categoría</th>
                    <th>Acción</th>
                    <th>Teclas</th>
                    <th>Descripción</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script src="indice.js"></script>
    <script>
        const tabla = document.querySelector("#tabla-atajos tbody");
        datosTeclado.forEach(truco => {
            const fila = document.createElement("tr");
            let catNombre = truco.categoria.replace('_', ' ');
            fila.innerHTML = `
                <td class="cat-${truco.categoria}"><strong>${catNombre}</strong></td>
                <td><strong>${truco.accion}</strong></td>
                <td><code>${truco.teclas}</code></td>
                <td>${truco.descripcion}</td>
            `;
            tabla.appendChild(fila);
        });
    </script>
</body>
</html>
