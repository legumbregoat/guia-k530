<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía K530</title>
    <style>
        body { background: #F2F2F7; font-family: sans-serif; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .teclas { font-weight: bold; color: #007AFF; }
    </style>
</head>
<body>
    <h1>Manual K530 + S20</h1>
    <div id="guia"></div>
    <script src="indice.js"></script>
    <script>
        const div = document.getElementById('guia');
        datosTeclado.forEach(t => {
            div.innerHTML += '<div class="card"><b>' + t.accion + '</b><br><span class="teclas">' + t.teclas + '</span><br>' + t.descripcion + '</div>';
        });
    </script>
</body>
</html>
